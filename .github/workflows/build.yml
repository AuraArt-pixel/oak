name: Build AE-Lite
on:
  push:
    branches: [ main, ae-lite, master ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-base-private
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openimageio
            mingw-w64-ucrt-x86_64-opencolorio
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glfw
      - shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT6=ON -DBUILD_TESTS=OFF -DUSE_WERROR=OFF
      - shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake --build build --config Release
      - shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/app/olive-editor.exe dist/AE-Lite.exe
          ldd build/app/olive-editor.exe | grep ucrt64 | awk '{print $3}' | while read dll; do cp "$dll" dist/ 2>/dev/null; done
          cp build/ffmpeg_bridge/libffmpeg_bridge.dll dist/ 2>/dev/null; true
      - uses: actions/upload-artifact@v4
        with:
          name: AE-Lite-Windows-x64
          path: dist/
          retention-days: 30
