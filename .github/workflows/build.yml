name: Build AE-Lite

on:
  push:
    branches: [ main, ae-lite, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openimageio
            mingw-w64-ucrt-x86_64-opencolorio
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-ccache

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=OFF -DBUILD_QT6=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/app/oak-editor.exe dist/AE-Lite.exe
          cp build/app/*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/*.dll dist/ 2>/dev/null || true
          mkdir -p dist/platforms dist/imageformats
          cp /ucrt64/share/qt6/plugins/platforms/qwindows.dll dist/platforms/ 2>/dev/null || true
          cp /ucrt64/share/qt6/plugins/imageformats/*.dll dist/imageformats/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AE-Lite-Windows-x64
          path: dist/
          retention-days: 30
