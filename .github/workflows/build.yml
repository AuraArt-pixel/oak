name: Build AE-Lite

on:
  push:
    branches: [ main, ae-lite, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openimageio
            mingw-w64-ucrt-x86_64-opencolorio
            mingw-w64-ucrt-x86_64-openexr
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-ccache

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_TESTS=OFF \
            -DBUILD_QT6=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
          echo "=== CMake Configure Exit Code: $? ==="

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --config Release 2>&1 | tee build.log

      - name: Show build errors on failure
        if: failure()
        shell: msys2 {0}
        run: |
          echo "========== LAST 80 LINES OF BUILD LOG =========="
          tail -80 build.log
          echo "========== CMAKE ERROR LOG (if exists) =========="
          cat build/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
          echo "========== CONFIGURE LOG ERRORS =========="
          grep -i -E "(error|fatal|failed|not found)" configure.log || echo "No obvious errors in configure log"
          echo "========== NINJA BUILD ERRORS =========="
          grep -i -E "(FAILED|error:|fatal error:)" build.log || echo "No error lines found in build log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: |
            build.log
            configure.log
          retention-days: 7

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/app/olive-editor.exe dist/AE-Lite.exe
          ldd build/app/olive-editor.exe | grep ucrt64 | awk '{print $3}' | while read dll; do
            cp "$dll" dist/ 2>/dev/null || true
          done
          cp build/ffmpeg_bridge/libffmpeg_bridge.dll dist/ 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AE-Lite-Windows-x64
          path: dist/
          retention-days: 30
